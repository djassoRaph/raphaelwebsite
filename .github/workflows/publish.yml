name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run blog build script
        run: python3 scripts/publish_blog.py

      - name: Install LLMR generator
        # llmr-generator 2.3.0, pinned to a commit: a moved branch or tag must not
        # change the code that writes files into the deploy. Its build tools are
        # pinned too: --no-build-isolation builds it with the setuptools and wheel
        # installed here instead of the latest ones from PyPI.
        run: |
          python3 -m pip install "setuptools==75.8.2" "wheel==0.45.1"
          python3 -m pip install --no-build-isolation "git+https://gitlab.com/open-llmr/python.git@d0cc3c98bded8885aa17da6c213ed619081caf40"

      - name: Build llmr.json and llms.txt
        run: python3 scripts/generate_llmr.py

      - name: List public/ folder contents
        run: ls -lh public/

      - name: Upload full site via FTP
        # Pinned to the commit behind v4.3.5: this step receives the FTP password,
        # so a re-pointed tag must not be able to swap in different code.
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          # The FTP certificate is issued to carambole.o2switch.net, not raphaelreck.com.
          # "loose" encrypts without checking the hostname; set FTP_SERVER to
          # carambole.o2switch.net and switch to "strict" to verify it as well.
          security: loose
          local-dir: ./
          # .txt files deploy (llms.txt, robots.txt); secret files are excluded by name.
          exclude: |
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/scripts/**
            **/*.py
            .gitignore
            export.txt
            token.txt
            secret/dashboard/config.php
            secret/dashboard/*.json
            **/google-service-account*.json
            -old.jpg
            grayscale_raphael.jpg
            portrait.jpeg


      - name: Print blog index footer
        run: tail -n 10 blog/index.html
