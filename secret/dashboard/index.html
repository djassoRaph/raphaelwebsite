<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard | Raphaël Reck</title>
    <base href="/secret/dashboard/">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous">

    <style>
      /* Dashboard-specific styles — inherits everything from style.css */

      .dashboard-container {
        max-width: 900px;
      }

      .dashboard-title {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 2rem;
        font-weight: 700;
        color: var(--color-text-primary);
        margin-bottom: 24px;
      }

      .dashboard-status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }

      #last-updated {
        font-size: 0.85rem;
        color: var(--color-text-tertiary);
      }

      .dashboard-error {
        display: none;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        background: var(--color-surface);
        border: 1px solid var(--color-error);
        border-left: 4px solid var(--color-error);
        border-radius: 8px;
        padding: 14px 18px;
        margin-bottom: 20px;
      }

      .dashboard-error.visible {
        display: flex;
      }

      #dashboard-error-message {
        color: var(--color-error);
        font-size: 0.9rem;
        font-weight: 500;
      }

      .dashboard-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        box-shadow: var(--shadow-card);
        padding: 20px 24px;
        margin-bottom: 20px;
      }

      .dashboard-card-title {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-text-tertiary);
        margin-bottom: 14px;
      }

      .loading-text {
        color: var(--color-text-tertiary);
        font-size: 0.85rem;
        font-style: italic;
      }

      /* Calendar card */
      .free-hours-row {
        text-align: center;
        padding: 6px 0 18px;
      }

      .free-hours-value {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 2.4rem;
        font-weight: 700;
        color: var(--color-accent);
        line-height: 1;
      }

      .free-hours-label {
        font-size: 0.75rem;
        color: var(--color-text-tertiary);
        margin-top: 6px;
      }

      .holiday-banner {
        display: none;
        background: var(--color-accent-light);
        color: var(--color-accent);
        font-size: 0.8rem;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 20px;
        margin-bottom: 12px;
      }

      .holiday-banner.visible {
        display: inline-block;
      }

      .ev {
        display: flex;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid var(--color-border);
      }

      .ev:last-child {
        border-bottom: none;
      }

      .ev-time {
        font-size: 0.75rem;
        color: var(--color-text-tertiary);
        min-width: 92px;
        white-space: nowrap;
      }

      .ev-title {
        font-size: 0.88rem;
        color: var(--color-text-primary);
      }

      /* Briefing card */
      .briefing-card {
        border-left: 4px solid var(--color-accent);
      }

      #briefing-text {
        font-size: 0.9rem;
        line-height: 1.7;
        color: var(--color-text-primary);
        white-space: pre-wrap;
      }

      /* Tasks board */
      .dashboard-board {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .status-column {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        box-shadow: var(--shadow-card);
        padding: 16px 18px;
      }

      .status-column-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .status-column-header h2 {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--color-text-primary);
      }

      .status-count-badge {
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        color: var(--color-text-secondary);
        font-size: 0.72rem;
        font-weight: 700;
        border-radius: 20px;
        padding: 2px 9px;
      }

      .task-card {
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }

      .task-card:last-child {
        margin-bottom: 0;
      }

      .task-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .task-title {
        font-size: 0.85rem;
        color: var(--color-text-primary);
        line-height: 1.4;
      }

      .priority-tag {
        flex-shrink: 0;
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        border: 1px solid;
        border-radius: 4px;
        padding: 1px 6px;
        white-space: nowrap;
      }

      .priority-high {
        color: var(--color-error);
        border-color: var(--color-error);
      }

      .priority-medium {
        color: var(--color-warning);
        border-color: var(--color-warning);
      }

      .priority-low {
        color: var(--color-text-tertiary);
        border-color: var(--color-text-tertiary);
      }

      .task-due {
        font-size: 0.72rem;
        color: var(--color-text-tertiary);
        margin-top: 5px;
      }

      .task-due.overdue {
        color: var(--color-error);
        font-weight: 600;
      }

      .task-empty {
        color: var(--color-text-tertiary);
        font-size: 0.8rem;
        font-style: italic;
      }

      @media (min-width: 768px) {
        .dashboard-board {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      @media (max-width: 480px) {
        .dashboard-card {
          padding: 16px 18px;
        }

        .free-hours-value {
          font-size: 2rem;
        }
      }
    </style>
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
      <i class="fas fa-moon"></i>
    </button>

    <main class="container dashboard-container">
        <nav class="nav-secondary">
          <a href="../../index.html" class="link-btn"><i class="fas fa-arrow-left"></i> Home</a>
        </nav>

        <h1 class="dashboard-title"><i class="fas fa-gauge-high"></i> Dashboard</h1>

        <div class="dashboard-status-bar">
          <span id="last-updated"></span>
          <button id="refresh-btn" class="link-btn"><i class="fas fa-rotate"></i> Refresh</button>
        </div>

        <div id="dashboard-error" class="dashboard-error">
          <p id="dashboard-error-message"></p>
          <button id="dashboard-retry-btn" class="link-btn"><i class="fas fa-rotate"></i> Try again</button>
        </div>

        <div class="dashboard-card">
          <div class="dashboard-card-title"><i class="fas fa-calendar-day"></i> Calendar — Today</div>
          <div id="calendar-content"><p class="loading-text"><i class="fas fa-spinner fa-spin"></i> Loading…</p></div>
        </div>

        <div id="briefing-card" class="dashboard-card briefing-card" style="display:none;">
          <div class="dashboard-card-title"><i class="fas fa-brain"></i> Briefing</div>
          <p id="briefing-text"></p>
        </div>

        <div class="dashboard-card-title" style="margin-top: 8px;"><i class="fas fa-list-check"></i> Tasks</div>
        <div id="tasks-board" class="dashboard-board">
          <div class="status-column">
            <div class="status-column-header"><h2>Doing</h2><span id="count-doing" class="status-count-badge">0</span></div>
            <div id="tasks-doing" class="task-list"><p class="loading-text">Loading…</p></div>
          </div>
          <div class="status-column">
            <div class="status-column-header"><h2>To Do</h2><span id="count-to-do" class="status-count-badge">0</span></div>
            <div id="tasks-to-do" class="task-list"><p class="loading-text">Loading…</p></div>
          </div>
          <div class="status-column">
            <div class="status-column-header"><h2>Backlog</h2><span id="count-backlog" class="status-count-badge">0</span></div>
            <div id="tasks-backlog" class="task-list"><p class="loading-text">Loading…</p></div>
          </div>
          <div class="status-column">
            <div class="status-column-header"><h2>Parking</h2><span id="count-parking" class="status-count-badge">0</span></div>
            <div id="tasks-parking" class="task-list"><p class="loading-text">Loading…</p></div>
          </div>
        </div>

        <footer class="footer">
          <p>&copy; 2026 Raphael Reck — Private Dashboard.</p>
        </footer>
    </main>

    <script>
      const themeToggle = document.getElementById('theme-toggle');
      const htmlElement = document.documentElement;
      const icon = themeToggle.querySelector('i');
      const currentTheme = localStorage.getItem('theme') || 'light';
      htmlElement.setAttribute('data-theme', currentTheme);
      updateIcon(currentTheme);
      themeToggle.addEventListener('click', () => {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        htmlElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateIcon(newTheme);
      });
      function updateIcon(theme) {
        if (theme === 'dark') { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); }
        else { icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
      }
    </script>

    <script>
      const STATUS_COLUMNS = [
        { key: 'Doing',   slug: 'doing'    },
        { key: 'To Do',   slug: 'to-do'    },
        { key: 'Backlog', slug: 'backlog'  },
        { key: 'Parking', slug: 'parking'  },
      ];

      const refreshBtn   = document.getElementById('refresh-btn');
      const errorBox     = document.getElementById('dashboard-error');
      const errorMessage = document.getElementById('dashboard-error-message');
      const retryBtn     = document.getElementById('dashboard-retry-btn');

      function escapeText(el, text) {
        el.textContent = text;
        return el;
      }

      function hideError() {
        errorBox.classList.remove('visible');
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorBox.classList.add('visible');
      }

      function setLoadingState(isLoading) {
        refreshBtn.disabled = isLoading;
        refreshBtn.innerHTML = isLoading
          ? '<i class="fas fa-spinner fa-spin"></i> Loading…'
          : '<i class="fas fa-rotate"></i> Refresh';
      }

      function renderCalendar(calendar) {
        const wrap = document.getElementById('calendar-content');
        wrap.innerHTML = '';

        if (calendar.holiday) {
          const badge = document.createElement('div');
          badge.className = 'holiday-banner visible';
          escapeText(badge, '🎉 ' + calendar.holiday.name);
          wrap.appendChild(badge);
        }

        const row = document.createElement('div');
        row.className = 'free-hours-row';
        const val = document.createElement('div');
        val.className = 'free-hours-value';
        val.textContent = calendar.free_hours + 'h';
        const label = document.createElement('div');
        label.className = 'free-hours-label';
        label.textContent = calendar.events.length === 0 ? 'free — no meetings today' : 'free today';
        row.appendChild(val);
        row.appendChild(label);
        wrap.appendChild(row);

        if (calendar.events.length > 0) {
          const list = document.createElement('div');
          calendar.events.forEach(ev => {
            const row = document.createElement('div');
            row.className = 'ev';

            const time = document.createElement('div');
            time.className = 'ev-time';
            if (ev.all_day || !ev.start || !ev.end) {
              time.textContent = 'All day';
            } else {
              const s = new Date(ev.start), e = new Date(ev.end);
              time.textContent = s.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) +
                ' – ' + e.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            }

            const title = document.createElement('div');
            title.className = 'ev-title';
            escapeText(title, ev.title || 'Untitled');

            row.appendChild(time);
            row.appendChild(title);
            list.appendChild(row);
          });
          wrap.appendChild(list);
        }
      }

      function renderBriefing(text) {
        const card = document.getElementById('briefing-card');
        const p = document.getElementById('briefing-text');
        escapeText(p, text || 'Briefing unavailable right now.');
        card.style.display = 'block';
      }

      function isOverdue(dueDateStr) {
        if (!dueDateStr) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return new Date(dueDateStr + 'T00:00:00') < today;
      }

      function priorityClass(priority) {
        if (priority === 'High') return 'priority-high';
        if (priority === 'Medium') return 'priority-medium';
        if (priority === 'Low') return 'priority-low';
        return null;
      }

      function renderTasks(tasksByStatus, counts) {
        STATUS_COLUMNS.forEach(col => {
          const listEl = document.getElementById('tasks-' + col.slug);
          const countEl = document.getElementById('count-' + col.slug);
          const tasks = tasksByStatus[col.key] || [];
          countEl.textContent = counts[col.key] || 0;
          listEl.innerHTML = '';

          if (tasks.length === 0) {
            const empty = document.createElement('p');
            empty.className = 'task-empty';
            empty.textContent = 'Nothing here.';
            listEl.appendChild(empty);
            return;
          }

          tasks.forEach(task => {
            const card = document.createElement('div');
            card.className = 'task-card';

            const top = document.createElement('div');
            top.className = 'task-card-top';

            const title = document.createElement('span');
            title.className = 'task-title';
            escapeText(title, task.title);
            top.appendChild(title);

            const pClass = priorityClass(task.priority);
            if (pClass) {
              const tag = document.createElement('span');
              tag.className = 'priority-tag ' + pClass;
              escapeText(tag, task.priority);
              top.appendChild(tag);
            }

            card.appendChild(top);

            if (task.due_date) {
              const due = document.createElement('div');
              due.className = 'task-due' + (isOverdue(task.due_date) ? ' overdue' : '');
              due.textContent = 'Due ' + task.due_date;
              card.appendChild(due);
            }

            listEl.appendChild(card);
          });
        });
      }

      function renderLastUpdated(isoString) {
        const d = new Date(isoString);
        document.getElementById('last-updated').textContent =
          'Updated ' + new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Europe/Paris', dateStyle: 'medium', timeStyle: 'short',
          }).format(d);
      }

      async function loadDashboard() {
        setLoadingState(true);
        hideError();

        try {
          const res = await fetch('api.php', { method: 'GET' });

          let data;
          try {
            data = await res.json();
          } catch (parseErr) {
            throw new Error('Unexpected response from server.');
          }

          if (!res.ok || data.error) {
            throw new Error(data.error || ('Request failed (HTTP ' + res.status + ').'));
          }

          renderCalendar(data.calendar);
          renderBriefing(data.briefing);
          renderTasks(data.tasks, data.task_counts);
          renderLastUpdated(data.generated_at);
        } catch (err) {
          showError(err.message);
        } finally {
          setLoadingState(false);
        }
      }

      refreshBtn.addEventListener('click', loadDashboard);
      retryBtn.addEventListener('click', loadDashboard);
      document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
